name: Build and push escl8 images

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WEB_IMAGE_NAME: escal8-agent
  WORKER_IMAGE_NAME: escal8-agent-worker
  JOB_IMAGE_NAME: escal8-agent-job

jobs:
  quality:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: NODE_OPTIONS="--max_old_space_size=4096" npx tsc --noEmit
      - name: Run tests
        run: find src -name '*.test.ts' -print0 | xargs -0 npx tsx --test
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=critical

  build-and-push:
    needs: quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    concurrency:
      group: agent-images-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Validate image secrets
        run: |
          test -n "${{ secrets.ACR_LOGIN_SERVER }}"
          test -n "${{ secrets.ACR_USERNAME }}"
          test -n "${{ secrets.ACR_PASSWORD }}"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push web image (dashboard)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.WEB_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.WEB_IMAGE_NAME }}:${{ github.ref_name == 'staging' && 'staging' || 'latest' }}
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.PRODUCTION_NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.PRODUCTION_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_APP_URL=${{ github.ref_name == 'staging' && 'https://staging-concierge.escal8.tech' || 'https://concierge.escal8.tech' }}
            SENTRY_ORG=${{ secrets.PRODUCTION_SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.PRODUCTION_SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.PRODUCTION_SENTRY_AUTH_TOKEN }}

      - name: Build and push worker image (RAG worker)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.ref_name == 'staging' && 'staging' || 'latest' }}
      - name: Build and push job image (requests rollover cron)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.job
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.JOB_IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.JOB_IMAGE_NAME }}:${{ github.ref_name == 'staging' && 'staging' || 'latest' }}

  deploy-aks:
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.4'

      - name: Set AKS context
        run: az aks get-credentials --resource-group Escal8 --name escal8-aks-b2 --overwrite-existing

      - name: Convert kubeconfig for kubelogin
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Restart AKS Deployments
        run: |
          kubectl rollout restart deployment escal8-agent-dashboard
          kubectl rollout restart deployment escal8-agent-worker
